spring.application.name=demo

# ========== MySQL 数据源 ==========
spring.datasource.url=jdbc:mysql://localhost:3306/ykd_robot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Mayizun617108.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# 应用默认输出 INFO 及以上日志；排查问题时可临时改成 DEBUG。
logging.level.ykd.demo=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# 本地知识库（query_local_kb 工具）
local-kb.pdf-path=kb.pdf
local-kb.chunk-size=500
local-kb.chunk-overlap=50
local-kb.api-host=dashscope.aliyuncs.com

# 上传文件大小（网页控制台解析 PDF/Word/Excel 用）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
